# Cargo.toml
[workspace]
resolver = "2"
members = [
    "migration",
    "pds",
    "cacos-pds-blobstore",
    "cacos-pds-plc",
    "cacos-pds-identity",
    "cacos-pds-handle",
    "cacos-pds-mailer",
]


[workspace.dependencies]                                                                                                                                                                                                                                                                                                                                                 
# --- atproto protocol crates (git-pinned rsky fork) ---
rsky-repo = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-crypto = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-syntax = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-common = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-blobstore = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-lexicon = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-oauth = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
rsky-identity = { git = "https://github.com/olamaelcu/rsky", rev = "aee5aec5ad9473d80232beab58ddba25a936298a" }
futures = "0.3"
opendal = { version = "0.53", default-features = false, features = ["services-fs", "services-s3", "services-memory"] }

# --- atproto ecosystem ---
atrium-api = "0.24.6"
lexicon_cid = { package = "cid", version = "0.11.1", features = ["serde-codec"] }
serde_ipld_dagcbor = { version = "0.6.1", features = ["codec"] }

# --- storage (this plan) ---
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-time", "sqlite-use-returning-for-3_35"] }
sea-orm-migration = "2.0"
sqlx = "0.9"
miette = { version = "7", features = ["derive"] }
thiserror = "2"
anyhow = "1.0.79"
camino = { version = "1", features = ["serde1"] }
camino-tempfile = "1"
ulid = { version = "3", features = ["serde", "std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
apalis = { version = "0.6", default-features = false }
apalis-sql = { version = "0.6", default-features = false, features = ["sqlite", "tokio-comp", "migrate"] }
sqlx_0_8 = { package = "sqlx", version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "json", "macros", "migrate"] }
async-stream = "0.3"
ipld-core = "0.4"

# --- serde ecosystem (required by rsky-* crate manifests via workspace = true) ---
serde_bytes = "0.11"
serde_cbor = "0.11"
serde_derive = "1"
serde_json = "1"
rand = "0.8"
rand_core = "0.6"
secp256k1 = { version = "0.28", features = ["global-context", "rand"] }
sha2 = "0.10"

# --- http / runtime ---
poem = { version = "3", features = ["tower-compat", "websocket"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }

# --- observability (pins locked in Plan 02, verified against docs.rs) ---
metrics = "0.24.4"
metrics-exporter-prometheus = { version = "0.17.2", default-features = false }
metrics-tracing-context = "0.18"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing-timing = { version = "0.7", features = ["layer"] }
tracing-unwrap = "1.0"

# --- misc ---
