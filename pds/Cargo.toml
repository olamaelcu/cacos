# pds/Cargo.toml
[package]
name = "cacos-pds"
version = "0.1.0"
edition = "2024"

[dependencies]
migration = { path = "../migration", package = "cacos-migration" }
sea-orm = { workspace = true }
tokio = { workspace = true }
camino = { workspace = true }
time = { workspace = true }

# --- error handling ---
anyhow = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }

# --- atproto protocol crates ---
lexicon_cid = { workspace = true }
rsky-common = { workspace = true }
rsky-repo = { workspace = true }
rsky-syntax = { workspace = true }
rsky-crypto = { workspace = true }

# --- crypto / encoding (Plan 03) ---
lru = "0.12"
sha2 = "0.10"
hex = "0.4"
secp256k1 = { version = "0.28", features = ["global-context", "rand"] }
rand = "0.8"

# --- observability (Plan 02) ---
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-tracing-context = { workspace = true }
poem = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-timing = { workspace = true }

[dev-dependencies]
camino-tempfile = { workspace = true }
poem = { workspace = true, features = ["test"] }
metrics = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = "1"
