# pds/Cargo.toml
[package]
name = "cacos-pds"
version = "0.1.0"
edition = "2024"

[features]
# Enables mock PLC / mock remote-create-account implementations and the
# `xrpc::test_utils` module for downstream integration tests.
test-utils = []

[dependencies]
migration = { path = "../migration", package = "cacos-migration" }
sea-orm = { workspace = true }
tokio = { workspace = true }
camino = { workspace = true }
time = { workspace = true }
serde_json = "1"
async-trait = "0.1"
base64 = "0.22"

# --- error handling ---
anyhow = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }

# --- encoding / dates / time ---
serde = { workspace = true }
chrono = "0.4"

# --- atproto protocol crates ---
lexicon_cid = { workspace = true }
rsky-common = { workspace = true }
rsky-repo = { workspace = true }
rsky-syntax = { workspace = true }
rsky-crypto = { workspace = true }
rsky-blobstore = { workspace = true }
rsky-lexicon = { workspace = true }
rsky-oauth = { workspace = true }
rsky-identity = { workspace = true }
futures = { workspace = true }
opendal = { workspace = true }

# --- crypto / encoding (Plan 03) ---
lru = "0.12"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
secp256k1 = { version = "0.28", features = ["global-context", "rand"] }
rand = "0.8"

# --- plc client port (Plan 08 task 18) ---
indexmap = { version = "2", features = ["serde"] }
data-encoding = "2"

# --- auth helper (Plan 05 task 5) ---
base64-url = "2.0.2"
jwt-simple = { version = "0.12.9", default-features = false, features = ["pure-rust"] }

# --- passwords / app passwords (Plan 05 task 2) ---
argon2 = "0.5.3"
base64ct = "1.6.0"

# --- email validation (Plan 08 task 7) ---
email_address = "0.2"

# --- observability (Plan 02) ---
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-tracing-context = { workspace = true }
poem = { workspace = true, features = ["cookie"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-timing = { workspace = true }
tracing-unwrap = { workspace = true }

# --- encoding primitives used by blobstore ---
bytes = "1"

# --- client metadata fetcher (Task 6) ---
reqwest = { version = "0.12", features = ["json"] }
url = "2"

# --- sequencer (Plan 07) ---
serde_bytes = { workspace = true }
serde_repr = { workspace = true }
serde_cbor = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
apalis = { workspace = true }
apalis-sql = { workspace = true }
sqlx_0_8 = { workspace = true }
async-stream = "0.3"
ipld-core = { workspace = true }
ulid = { workspace = true }

# --- temp paths (test_utils runs in lib) ---
tempfile = "3"

# --- constant-time comparisons (admin auth + secret comparison hardening) ---
subtle = "2"

# --- at-rest hygiene for key material (PDS_JWT_KEYPAIR, PDS_REPO_SIGNING_KEYPAIR,
#     PDS_PLC_ROTATION_KEYPAIR, PDS_DPOP_SECRET) ---
secrecy = "0.10"
zeroize = "1"

# --- rate limiting (per-IP token bucket for sensitive endpoints) ---
governor = "0.6"

# --- Step 1 extraction: leaf crates pulled out of cacos-pds ---
cacos-pds-blobstore = { path = "../cacos-pds-blobstore" }
cacos-pds-plc = { path = "../cacos-pds-plc", features = ["test-utils"] }
cacos-pds-identity = { path = "../cacos-pds-identity" }
cacos-pds-handle = { path = "../cacos-pds-handle" }
cacos-pds-mailer = { path = "../cacos-pds-mailer" }

# --- Step 2 extraction: foundation crate (error, config, observability, db, background) ---
cacos-pds-core = { path = "../cacos-pds-core", features = ["test-utils"] }

[dev-dependencies]                                                                                                                                                                                                                                                                                                                                                 
camino-tempfile = { workspace = true }
poem = { workspace = true, features = ["test"] }
metrics = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
wiremock = "0.6"
tokio-tungstenite = "0.27"
cacos-pds = { path = ".", features = ["test-utils"] }
