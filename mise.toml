[tools]
rust = "1.97.0"
"cargo:cargo-nextest" = "0.9.115"
"github:corca-ai/nose" = "0.20.0"

[env]
MINIO_ROOT_USER = "cacos"
MINIO_ROOT_PASSWORD = "cacos-secret"
S3_ENDPOINT = "http://127.0.0.1:9000"
S3_ACCESS_KEY_ID = "cacos"
S3_SECRET_ACCESS_KEY = "cacos-secret"
S3_BUCKET = "cacos"
S3_REGION = "us-east-1"

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-targets"

[tasks.fmt]
description = "Check rustfmt formatting"
run = "cargo fmt --all -- --check"

[tasks.format]
description = "Apply rustfmt formatting"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy lint with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run tests with nextest"
run = "cargo nextest run --workspace"

[tasks.dup]
description = "Report code duplication (nose)"
run = "nose query -r pds/src -r pds/tests -r migration/src"

[tasks.infra-up]
description = "Start MinIO headlessly and detached, run bucket init"
run = "docker compose up -d --wait minio && docker compose up mc-init"

[tasks.infra-down]
description = "Stop MinIO containers"
run = "docker compose down"

[tasks.gen-secrets]
description = "Generate dev-only secrets into .env.local (idempotent)"
run = '''
if [ ! -f .env.local ]; then
  JWT_KEY=$(openssl rand -hex 32)
  cat > .env.local <<EOF
PDS_ACCESS_JWT_KEY_K256_PRIVATE_KEY_HEX=${JWT_KEY}
PDS_JWT_KEY_K256_PRIVATE_KEY_HEX=${JWT_KEY}
PDS_OAUTH_SIGNING_KEY_K256_PRIVATE_KEY_HEX=${JWT_KEY}
PDS_REPO_SIGNING_KEY_K256_PRIVATE_KEY_HEX=$(openssl rand -hex 32)
PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=$(openssl rand -hex 32)
PDS_DPOP_SECRET=$(openssl rand -hex 32)
PDS_OAUTH_TRUSTED_CLIENTS=https://local.example/client.json
PDS_SERVICE_DID=did:web:localhost
PDS_SERVICE_HANDLE_DOMAINS=.localhost
PDS_ADMIN_PASSWORD=LocalDev7AdminQxfK3mZx
PDS_ALLOW_INSECURE_ADMIN=true
EOF
  echo "wrote .env.local"
fi
'''

[tasks.dev]
description = "Run the PDS with MinIO up"
depends = ["infra-up", "gen-secrets"]
run = "set -a && . ./.env.local && set +a && cargo run -p cacos-pds-server"

[tasks.pds-dev]
description = "Run the frontend remote client"
env = { _.file = "remote-client/.env" }
dir = "remote-client"
run = "pnpm dev"
