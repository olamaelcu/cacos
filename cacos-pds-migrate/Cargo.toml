[package]
name = "cacos-pds-migrate"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cacos-pds-migrate"
path = "src/main.rs"

[dependencies]
# --- foundation + domain crates ---
cacos-pds-core = { path = "../cacos-pds-core" }
cacos-pds-account = { path = "../cacos-pds-account" }
cacos-pds-actor-store = { path = "../cacos-pds-actor-store" }
cacos-pds-sequencer = { path = "../cacos-pds-sequencer" }
cacos-pds-server = { path = "../cacos-pds-server" }
cacos-pds-plc = { path = "../cacos-pds-plc" }
cacos-pds-mailer = { path = "../cacos-pds-mailer" }
cacos-pds-identity = { path = "../cacos-pds-identity" }

# --- atproto protocol crates ---
rsky-lexicon = { workspace = true }
rsky-common = { workspace = true }
rsky-crypto = { workspace = true }
rsky-identity = { workspace = true }

# --- storage ---
migration = { path = "../migration", package = "cacos-migration" }
sea-orm = { workspace = true }

# --- error handling ---
anyhow = { workspace = true }
thiserror = { workspace = true }

# --- encoding / dates ---
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }

# --- crypto / encoding ---
hex = { workspace = true }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
base64-url = "2.0.2"

# --- at-rest hygiene ---
secrecy = { workspace = true }
zeroize = { workspace = true }

# --- async / futures ---
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# --- observability ---
tracing = { workspace = true }
metrics = { workspace = true }

# --- runtime env helpers ---
once_cell = "1"
