[package]
name = "cacos-pds-account"
version = "0.1.0"
edition = "2024"

[features]
# Exposes mock OAuth client + helpers for downstream integration tests.
test-utils = []

[dependencies]
# --- foundation ---
cacos-pds-core = { path = "../cacos-pds-core" }
migration = { path = "../migration", package = "cacos-migration" }
sea-orm = { workspace = true }

# --- error handling ---
anyhow = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }

# --- atproto protocol crates ---
rsky-lexicon = { workspace = true }
rsky-common = { workspace = true }
rsky-oauth = { workspace = true }
rsky-crypto = { workspace = true }
lexicon_cid = { workspace = true }
rsky-syntax = { workspace = true }

# --- metrics / observability ---
metrics = { workspace = true }
tracing = { workspace = true }

# --- encoding / dates ---
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
time = { workspace = true }

# --- crypto / encoding (Plan 03) ---
sha2 = { workspace = true }
hex = { workspace = true }
secp256k1 = { workspace = true, features = ["global-context", "rand"] }
rand = { workspace = true }

# --- auth helper (Plan 05 task 5) ---
base64-url = "3.0"
jwt-simple = { version = "0.13.0", default-features = false, features = [
  "pure-rust",
] }

# --- passwords / app passwords (Plan 05 task 2) ---
argon2 = { workspace = true }
base64ct = { workspace = true }

# --- email validation (Plan 08 task 7) ---
email_address = { workspace = true }

# --- constant-time comparisons ---
subtle = { workspace = true }

# --- at-rest hygiene for key material (PDS_JWT_KEYPAIR, PDS_REPO_SIGNING_KEYPAIR,
#     PDS_PLC_ROTATION_KEYPAIR, PDS_DPOP_SECRET) ---
secrecy = { workspace = true }
zeroize = { workspace = true }

# --- runtime / traits ---
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
camino-tempfile = { workspace = true }
camino = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-tracing-context = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
wiremock = "0.6"
tokio-tungstenite = "0.27"
time = { workspace = true }
