[package]
name = "cacos-pds-account"
version = "0.1.0"
edition = "2024"

[features]
# Exposes mock OAuth client + helpers for downstream integration tests.
test-utils = []

[dependencies]
# --- foundation ---
cacos-pds-core = { path = "../cacos-pds-core" }
migration = { path = "../migration", package = "cacos-migration" }
sea-orm = { workspace = true }

# --- error handling ---
anyhow = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }

# --- atproto protocol crates ---
rsky-lexicon = { workspace = true }
rsky-common = { workspace = true }
rsky-oauth = { workspace = true }
rsky-crypto = { workspace = true }
lexicon_cid = { workspace = true }
rsky-syntax = { workspace = true }

# --- metrics / observability ---
metrics = { workspace = true }
tracing = { workspace = true }

# --- encoding / dates ---
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4"
time = { workspace = true }

# --- crypto / encoding (Plan 03) ---
sha2 = "0.10"
hex = "0.4"
secp256k1 = { version = "0.28", features = ["global-context", "rand"] }
rand = { workspace = true }

# --- auth helper (Plan 05 task 5) ---
base64-url = "2.0.2"
jwt-simple = { version = "0.12.9", default-features = false, features = ["pure-rust"] }

# --- passwords / app passwords (Plan 05 task 2) ---
argon2 = "0.5.3"
base64ct = "1.6.0"

# --- email validation (Plan 08 task 7) ---
email_address = "0.2"

# --- constant-time comparisons ---
subtle = "2"

# --- at-rest hygiene for key material (PDS_JWT_KEYPAIR, PDS_REPO_SIGNING_KEYPAIR,
#     PDS_PLC_ROTATION_KEYPAIR, PDS_DPOP_SECRET) ---
secrecy = "0.10"
zeroize = "1"

# --- runtime / traits ---
tokio = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
camino-tempfile = { workspace = true }
camino = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-tracing-context = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
wiremock = "0.6"
tokio-tungstenite = "0.27"
time = { workspace = true }
