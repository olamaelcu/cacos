[package]
name = "cacos-pds-plc"
version = "0.1.0"
edition = "2024"

[features]
# Enables the `MockPlcClient` and its `PlcClient` impl for downstream
# integration tests. Mirrors the feature gate on cacos-pds itself.
test-utils = []

[dependencies]
# --- foundation crates ---
cacos-pds-core = { path = "../cacos-pds-core" }

# --- atproto protocol crates (only rsky-common is used by this crate) ---
rsky-common = { workspace = true }

# --- http client for the PLC directory ---
reqwest = { workspace = true }
url = { workspace = true }

# --- serde ecosystem ---
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

# --- crypto / encoding ---
secp256k1 = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
base64-url = "2.0.2"
# hex is used by the `test-utils` feature for the mock client's secret key
hex = { workspace = true }

# --- runtime / traits ---
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
