[package]
name = "cacos-pds-oauth"
version = "0.1.0"
edition = "2024"

[features]
# Mock RemoteCreateAccount / fixtures for downstream integration tests.
test-utils = []

[dependencies]
# --- foundation + domain deps ---
cacos-pds-core = { path = "../cacos-pds-core" }
cacos-pds-account = { path = "../cacos-pds-account" }
cacos-pds-actor-store = { path = "../cacos-pds-actor-store" }
cacos-pds-plc = { path = "../cacos-pds-plc", features = ["test-utils"] }
cacos-pds-sequencer = { path = "../cacos-pds-sequencer" }
cacos-pds-blobstore = { path = "../cacos-pds-blobstore" }

# --- atproto protocol crates ---
rsky-oauth = { workspace = true }
rsky-common = { workspace = true }
# governor is enabled by workspace.dependencies

# --- storage ---
migration = { path = "../migration", package = "cacos-migration" }
sea-orm = { workspace = true }

# --- error handling ---
anyhow = { workspace = true }
email_address = { workspace = true }
thiserror = { workspace = true }

# --- encoding / dates ---
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

# --- HTTP (poem) ---
poem = { workspace = true }
governor = { workspace = true }

# --- crypto / encoding ---
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
secp256k1 = { workspace = true }
rsky-crypto = { workspace = true }
rand = { workspace = true }
# subtle already in workspace.dependencies

# --- http / metadata fetch ---
reqwest = { workspace = true }
url = { workspace = true }

# --- at-rest hygiene ---
secrecy = { workspace = true }
zeroize = { workspace = true }

# --- runtime / traits ---
tokio = { workspace = true }
async-trait = { workspace = true }

# --- observability ---
tracing = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
camino-tempfile = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
wiremock = "0.6"
poem = { workspace = true, features = ["test"] }
